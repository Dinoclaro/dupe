services:
  postgres:
    image: postgres:16-alpine
    container_name: dupe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dupe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dupe_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-dupe}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dupe_pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dupe} -d ${POSTGRES_DB:-dupe}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dupe_pgdata:
