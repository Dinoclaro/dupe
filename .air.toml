root = "backend"
tmp_dir = "backend/tmp"

[build]
  cmd = "go build -o ./tmp/server ."
  bin = "./tmp/server"
  delay = 500
  exclude_dir = ["tmp", "vendor", "../storage", "../web"]
  include_ext = ["go", "sql"]
  kill_delay = "500ms"
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
